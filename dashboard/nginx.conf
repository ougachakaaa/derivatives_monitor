worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
        location /api/ {
            # Runtime DNS lets the frontend start without query and recover after
            # query is recreated with a new IP. Collector has no dependency here.
            resolver 127.0.0.11 valid=5s ipv6=off;
            set $query_upstream http://query:8000;
            proxy_pass $query_upstream;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location / { add_header Cache-Control no-cache; try_files $uri $uri/ /index.html; }
    }
}
